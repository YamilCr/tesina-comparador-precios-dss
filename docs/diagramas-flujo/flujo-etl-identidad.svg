<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="2070" viewBox="0 0 1780 2070" role="img" aria-labelledby="title"><title id="title">Flujo ETL y resolución de identidad</title><defs><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#233238"/></marker><marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#53676e"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#197158"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#28617c"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a04346"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="49" text-anchor="start" font-size="32" fill="#233238" font-weight="700">Flujo ETL y resolución de identidad</text><text x="40" y="83" text-anchor="start" font-size="19" fill="#53676e" font-weight="400">Extracción por fuente y procesamiento por registro | 14 SEP 2026</text><path d="M 850 174 V 225" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 850 335 V 354" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 640 420 H 435" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 240 470 V 521" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 850 486 V 515" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 850 605 V 645" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 850 735 V 759" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 640 825 H 435" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 240 874 V 990 H 20 V 1480 H 850 V 1499" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 850 891 V 905" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 850 1015 V 1034" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 1060 1100 H 1235" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 1450 1159 V 1480 H 850 V 1499" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 850 1166 V 1179" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 640 1245 H 435" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 240 1294 V 1400 H 615" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 850 1311 V 1345" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 850 1455 V 1499" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 1060 1565 H 1720 V 690 H 1085" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 850 1631 V 1661" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 850 1759 V 1791" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 1085 1840 H 1215" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="6 5"/><path d="M 850 1889 V 1931" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 1450 1889 V 1960 H 1010" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="6 5"/><rect x="615" y="116" width="470" height="58" rx="29" fill="#eef6f3" stroke="#197158" stroke-width="1.8"/><text x="850" y="152.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Inicio manual / plan / script</text><rect x="615" y="225" width="470" height="110" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="850" y="259.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">Ejecutar scrapers concurrentemente</text><text x="850" y="286.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">aiohttp / Playwright + límites</text><text x="850" y="313.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Entregar resultados a la cola</text><path d="M 850 354 L 1060 420 L 850 486 L 640 420 Z" fill="#fff8df" stroke="#8f7940" stroke-width="2"/><text x="850" y="413.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">¿La extracción</text><text x="850" y="440.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">de la fuente fue exitosa?</text><rect x="45" y="370" width="390" height="100" rx="6" fill="#fcf1f1" stroke="#a04346" stroke-width="1.8"/><text x="240" y="413.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="600">Registrar fallo de la fuente</text><text x="240" y="439.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="400">Las demás fuentes continúan</text><rect x="75" y="521" width="330" height="58" rx="29" fill="#eef6f3" stroke="#197158" stroke-width="1.8"/><text x="240" y="557.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Fin de esta fuente</text><rect x="615" y="515" width="470" height="90" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="850" y="553.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">Guardar corrida y datos en staging</text><text x="850" y="580.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Iniciar procesamiento de registros</text><rect x="615" y="645" width="470" height="90" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="850" y="683.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Validar, limpiar y normalizar</text><text x="850" y="711.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="400">Precio, regex, unidades y packs</text><path d="M 850 759 L 1060 825 L 850 891 L 640 825 Z" fill="#fff8df" stroke="#8f7940" stroke-width="2"/><text x="850" y="818.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">¿El registro es válido</text><text x="850" y="845.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">y no está duplicado?</text><rect x="45" y="776" width="390" height="98" rx="6" fill="#fcf1f1" stroke="#a04346" stroke-width="1.8"/><text x="240" y="818.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="600">Marcar rechazado o duplicado</text><text x="240" y="844.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="400">Conservar el motivo</text><rect x="615" y="905" width="470" height="110" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="850" y="939.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">Resolver identidad del producto</text><text x="850" y="966.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Publicación / GTIN / restricciones</text><text x="850" y="993.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Reglas estructurales + RapidFuzz</text><path d="M 850 1034 L 1060 1100 L 850 1166 L 640 1100 Z" fill="#fff8df" stroke="#8f7940" stroke-width="2"/><text x="850" y="1093.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">¿La identidad</text><text x="850" y="1120.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">es ambigua?</text><rect x="1235" y="1041" width="430" height="118" rx="6" fill="#fcf1f1" stroke="#a04346" stroke-width="1.8"/><text x="1450" y="1080.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="600">Conservar como unmatched</text><text x="1450" y="1106.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="400">Motivo y candidatos para revisión</text><text x="1450" y="1132.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="400">No crear un duplicado por la duda</text><path d="M 850 1179 L 1060 1245 L 850 1311 L 640 1245 Z" fill="#fff8df" stroke="#8f7940" stroke-width="2"/><text x="850" y="1238.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">¿Existe un producto</text><text x="850" y="1265.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">canónico identificado?</text><rect x="45" y="1196" width="390" height="98" rx="6" fill="#f2f7f9" stroke="#197158" stroke-width="1.8"/><text x="240" y="1238.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="600">Crear producto nuevo</text><text x="240" y="1264.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="400">Si la carga permite crearlo</text><rect x="615" y="1345" width="470" height="110" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="850" y="1379.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">Guardar publicación y precio</text><text x="850" y="1406.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Conservar enlaces de imágenes</text><text x="850" y="1433.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Marcar el registro como cargado</text><path d="M 850 1499 L 1060 1565 L 850 1631 L 640 1565 Z" fill="#fff8df" stroke="#8f7940" stroke-width="2"/><text x="850" y="1558.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">¿Quedan registros</text><text x="850" y="1585.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">por procesar?</text><rect x="615" y="1661" width="470" height="98" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="850" y="1703.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">Confirmar transacción PostgreSQL</text><text x="850" y="1730.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Productos, precios y estados ETL</text><rect x="615" y="1791" width="470" height="98" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="850" y="1833.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">Intentar upsert en Chroma</text><text x="850" y="1860.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Solo productos nuevos de la carga</text><rect x="1215" y="1791" width="470" height="98" rx="6" fill="#fcf1f1" stroke="#a04346" stroke-width="1.8"/><text x="1450" y="1833.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="600">Si falla: warning y futura reindexación</text><text x="1450" y="1859.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="400">No revertir la carga ya confirmada</text><rect x="690" y="1931" width="320" height="58" rx="29" fill="#eef6f3" stroke="#197158" stroke-width="1.8"/><text x="850" y="1967.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Fin de la carga</text><text x="540" y="402" text-anchor="middle" font-size="18" fill="#a04346" font-weight="600">No</text><text x="885" y="507" text-anchor="middle" font-size="18" fill="#197158" font-weight="600">Sí</text><text x="540" y="807" text-anchor="middle" font-size="18" fill="#a04346" font-weight="600">No</text><text x="890" y="896" text-anchor="middle" font-size="18" fill="#197158" font-weight="600">Sí</text><text x="1145" y="1082" text-anchor="middle" font-size="18" fill="#a04346" font-weight="600">Sí</text><text x="885" y="1179" text-anchor="middle" font-size="18" fill="#233238" font-weight="600">No</text><text x="540" y="1227" text-anchor="middle" font-size="18" fill="#197158" font-weight="600">No</text><text x="885" y="1335" text-anchor="middle" font-size="18" fill="#197158" font-weight="600">Sí</text><text x="1410" y="1548" text-anchor="middle" font-size="18" fill="#233238" font-weight="600">Sí: siguiente registro</text><text x="885" y="1653" text-anchor="middle" font-size="18" fill="#233238" font-weight="600">No</text><text x="1150" y="1820" text-anchor="middle" font-size="18" fill="#a04346" font-weight="600">Fallo</text><path d="M 40 1992 H 1740" stroke="#cad3d6"/><text x="40" y="2020" text-anchor="start" font-size="18" fill="#53676e" font-weight="400">Flujo resumido con creación habilitada (valor predeterminado). Sin ella, los productos nuevos quedan sin asociar.</text><text x="40" y="2047" text-anchor="start" font-size="18" fill="#53676e" font-weight="400">La revisión y consolidación auditada es un proceso posterior; Chroma no interviene en la decisión de identidad.</text></g></svg>