<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1530" viewBox="0 0 1500 1530" role="img" aria-labelledby="title"><title id="title">Flujo de búsqueda de productos</title><defs><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#233238"/></marker><marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#53676e"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#197158"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#28617c"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a04346"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="49" text-anchor="start" font-size="32" fill="#233238" font-weight="700">Flujo de búsqueda de productos</text><text x="40" y="83" text-anchor="start" font-size="19" fill="#53676e" font-weight="400">Consulta no vacía | Texto primero, Chroma como recuperación alternativa | 14 SEP 2026</text><path d="M 750 174 V 227" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 750 313 V 344" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 540 410 H 420" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 240 459 V 1285 H 515" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 750 476 V 510" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 750 620 V 644" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 960 710 H 1070" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 1250 759 V 1071" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 750 776 V 812" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 750 898 V 937" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 750 1023 V 1054" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><path d="M 960 1120 H 1060" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 1250 1169 V 1285 H 985" fill="none" stroke="#a04346" stroke-width="2" marker-end="url(#arrow-red)"/><path d="M 750 1186 V 1236" fill="none" stroke="#197158" stroke-width="2" marker-end="url(#arrow-green)"/><path d="M 750 1334 V 1371" fill="none" stroke="#233238" stroke-width="2" marker-end="url(#arrow-ink)"/><rect x="590" y="116" width="320" height="58" rx="29" fill="#eef6f3" stroke="#197158" stroke-width="1.8"/><text x="750" y="152.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Recibir consulta</text><rect x="515" y="227" width="470" height="86" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="750" y="263.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Buscar coincidencias textuales</text><text x="750" y="291.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="400">Aplicar filtro de categoría</text><path d="M 750 344 L 960 410 L 750 476 L 540 410 Z" fill="#fff8df" stroke="#8f7940" stroke-width="2"/><text x="750" y="403.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">¿Hay coincidencias</text><text x="750" y="430.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">textuales?</text><rect x="60" y="361" width="360" height="98" rx="6" fill="#f2f7f9" stroke="#197158" stroke-width="1.8"/><text x="240" y="403.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="600">Conservar resultados textuales</text><text x="240" y="429.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="400">No consultar Chroma</text><rect x="515" y="510" width="470" height="110" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="750" y="544.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">Consultar Chroma si está habilitado</text><text x="750" y="571.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">E5: query: + similitud coseno</text><text x="750" y="598.8" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">top_k = min(límite * 3, 50)</text><path d="M 750 644 L 960 710 L 750 776 L 540 710 Z" fill="#fff8df" stroke="#8f7940" stroke-width="2"/><text x="750" y="703.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">¿Se pudo consultar</text><text x="750" y="730.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">el índice?</text><rect x="1070" y="661" width="360" height="98" rx="6" fill="#fcf1f1" stroke="#a04346" stroke-width="1.8"/><text x="1250" y="703.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="600">Si hay fallo: registrar aviso</text><text x="1250" y="729.46" text-anchor="middle" font-size="19" fill="#233238" font-weight="400">Si está deshabilitado: omitir</text><rect x="515" y="812" width="470" height="86" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="750" y="848.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Aplicar umbral de similitud</text><text x="750" y="876.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="400">Conservar IDs candidatos</text><rect x="515" y="937" width="470" height="86" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="750" y="973.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Verificar activos en PostgreSQL</text><text x="750" y="1001.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="400">Aplicar filtro de categoría</text><path d="M 750 1054 L 960 1120 L 750 1186 L 540 1120 Z" fill="#fff8df" stroke="#8f7940" stroke-width="2"/><text x="750" y="1113.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">¿Quedan productos</text><text x="750" y="1140.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">válidos?</text><rect x="1060" y="1071" width="380" height="98" rx="6" fill="#fcf1f1" stroke="#a04346" stroke-width="1.8"/><text x="1250" y="1113.62" text-anchor="middle" font-size="18" fill="#233238" font-weight="600">Conservar resultado textual vacío</text><text x="1250" y="1138.62" text-anchor="middle" font-size="18" fill="#233238" font-weight="400">Sin coincidencias para devolver</text><rect x="515" y="1236" width="470" height="98" rx="6" fill="#f2f7f9" stroke="#28617c" stroke-width="1.8"/><text x="750" y="1278.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="600">Devolver productos o lista vacía</text><text x="750" y="1305.3" text-anchor="middle" font-size="20" fill="#233238" font-weight="400">Sin duplicados ni score semántico</text><rect x="575" y="1371" width="350" height="58" rx="29" fill="#eef6f3" stroke="#197158" stroke-width="1.8"/><text x="750" y="1407.14" text-anchor="middle" font-size="21" fill="#233238" font-weight="600">Fin de la consulta</text><text x="480" y="393" text-anchor="middle" font-size="18" fill="#197158" font-weight="600">Sí</text><text x="780" y="500" text-anchor="middle" font-size="18" fill="#233238" font-weight="600">No</text><text x="1015" y="692" text-anchor="middle" font-size="18" fill="#a04346" font-weight="600">No</text><text x="780" y="798" text-anchor="middle" font-size="18" fill="#197158" font-weight="600">Sí</text><text x="1010" y="1103" text-anchor="middle" font-size="18" fill="#a04346" font-weight="600">No</text><text x="780" y="1215" text-anchor="middle" font-size="18" fill="#197158" font-weight="600">Sí</text><path d="M 40 1442 H 1460" stroke="#cad3d6"/><text x="40" y="1470" text-anchor="start" font-size="18" fill="#53676e" font-weight="400">Si la consulta está vacía, se lista el catálogo activo paginado sin recorrer este flujo.</text><text x="40" y="1497" text-anchor="start" font-size="18" fill="#53676e" font-weight="400">La búsqueda semántica recupera candidatos: no aprueba equivalencias ni fusiona productos.</text></g></svg>