services:
  postgres:
    image: postgres:16-alpine
    container_name: price-dss-postgres
    environment:
      POSTGRES_DB: price_dss
      POSTGRES_USER: dss_user
      POSTGRES_PASSWORD: dss_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss_user -d price_dss"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
