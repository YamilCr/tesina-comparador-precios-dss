services:
  - type: web
    name: price-dss-api
    runtime: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: price-dss-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: INGESTION_SCHEDULER_ENABLED
        value: "false"
      - key: INGESTION_SCHEDULER_EMBEDDED_ENABLED
        value: "false"
      - key: VECTOR_SEARCH_ENABLED
        value: "true"
      - key: VECTOR_EMBEDDING_MODEL
        value: intfloat/multilingual-e5-small
      - key: VECTOR_EMBEDDING_DIMENSIONS
        value: "384"
      - key: CORS_ORIGINS
        sync: false

  - type: cron
    name: price-dss-ingestion
    runtime: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    schedule: "*/10 * * * *"
    dockerCommand: python scripts/run_due_scraping_schedules.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: price-dss-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: INGESTION_SCHEDULER_ENABLED
        value: "true"
      - key: INGESTION_SCHEDULER_EMBEDDED_ENABLED
        value: "false"
      - key: VECTOR_SEARCH_ENABLED
        value: "true"
      - key: VECTOR_EMBEDDING_MODEL
        value: intfloat/multilingual-e5-small
      - key: VECTOR_EMBEDDING_DIMENSIONS
        value: "384"

  - type: web
    name: price-dss-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_MODE
        value: live
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: price-dss-postgres
    databaseName: price_dss
    user: dss_user
